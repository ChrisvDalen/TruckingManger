<h2>Available Jobs</h2>
<table>
  <tr><th>ID</th><th>Distance</th><th>Reward</th><th>Truck</th><th></th></tr>
  @for (job of jobs(); track job.id) {
  <tr>
    <td>{{ job.id }}</td>
    <td>{{ job.distance }} km</td>
    <td>{{ job.reward | currency:'EUR' }}</td>
    <td>
      <select #t>
        @for (truck of status()?.trucks ?? []; track truck.id) {
          <option [value]="truck.id">{{ truck.name }}</option>
        }
      </select>
    </td>
    <td><button (click)="accept(job.id, +t.value)">Accept</button></td>
  </tr>
  }
</table>
<button (click)="load()">Refresh</button>
