<h2>Trucks</h2>
<ul>
  <li *ngFor="let t of status?.trucks">{{t.name}} - {{t.fuelConsumption}} L/100km</li>
</ul>
<h3>Buy Truck</h3>
<label>Name <input [(ngModel)]="newTruck.name"></label>
<label>Consumption <input type="number" [(ngModel)]="newTruck.consumption"></label>
<label>Price <input type="number" [(ngModel)]="newTruck.price"></label>
<button (click)="buy()">Buy</button>
