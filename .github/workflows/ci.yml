name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/trucking-manager-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/trucking-manager-frontend/package-lock.json
      # `npm install` (not `npm ci`) so platform-specific optional native
      # bindings (rolldown, esbuild, lightningcss, ...) are resolved for the
      # runner's architecture. The lockfile was generated on a different arch,
      # and `npm ci` would skip the x64 bindings (npm/cli#4828). Versions are
      # still governed by package-lock.json.
      - run: npm install
      # Fail the build if a dependency (including transitive) has a known
      # vulnerability. Keep this in lockstep with `npm audit` in CI.
      - run: npm audit --audit-level=low
      - run: npm test
      - run: npm run build
